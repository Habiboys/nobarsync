services:
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "http://edge:80", "--host-header=localhost", "--url=${NGROK_URL:-}", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./infra/ngrok/ngrok.yml:/etc/ngrok.yml:ro
    depends_on:
      - edge

  turn:
    image: coturn/coturn:4.18.0-r0-alpine
    profiles: ["turn"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/coturn/entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_REALM: ${TURN_REALM:-nobarsync.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_TLS_ENABLED: ${TURN_TLS_ENABLED:-false}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    volumes:
      - ./infra/turn/entrypoint.sh:/etc/coturn/entrypoint.sh:ro
      - ./infra/turn/turnserver.conf:/etc/coturn/nobarsync.conf:ro
      - ./infra/turn/certs:/certs:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nobarsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nobarsync}
      POSTGRES_DB: ${POSTGRES_DB:-nobarsync}
    volumes:
      - prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nobarsync}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nobarsync}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nobarsync-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost}
    volumes:
      - prod_minio:/data
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-nobarsync}"]
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-nobarsync}:${S3_SECRET_KEY:-nobarsync-secret}@minio:9000
    restart: on-failure

  api:
    image: nobarsync:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      NOBARSYNC_ROLE: api
      IMPORT_HOST_ALLOWLIST: ${IMPORT_HOST_ALLOWLIST:-}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-2147483648}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      DATABASE_URL: ecto://${POSTGRES_USER:-nobarsync}:${POSTGRES_PASSWORD:-nobarsync}@postgres:5432/${POSTGRES_DB:-nobarsync}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PORT: 4000
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nobarsync}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-nobarsync-secret}
      S3_BUCKET: ${S3_BUCKET:-nobarsync}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SCHEME: ${S3_SCHEME:-http://}
      S3_HOST: ${S3_HOST:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_PUBLIC_SCHEME: ${S3_PUBLIC_SCHEME:-http://}
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-localhost}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-9000}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2

  worker:
    image: nobarsync:local
    environment:
      NOBARSYNC_ROLE: worker
      IMPORT_HOST_ALLOWLIST: ${IMPORT_HOST_ALLOWLIST:-}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-2147483648}
      DATABASE_URL: ecto://${POSTGRES_USER:-nobarsync}:${POSTGRES_PASSWORD:-nobarsync}@postgres:5432/${POSTGRES_DB:-nobarsync}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET}
      PORT: 4000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nobarsync}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-nobarsync-secret}
      S3_BUCKET: ${S3_BUCKET:-nobarsync}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SCHEME: ${S3_SCHEME:-http://}
      S3_HOST: ${S3_HOST:-minio}
      S3_PORT: ${S3_PORT:-9000}
      ENCODE_CONCURRENCY: ${ENCODE_CONCURRENCY:-1}
      ENCODE_THREADS: ${ENCODE_THREADS:-2}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2

  edge:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "${EDGE_PORT:-5178}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod_postgres:
  prod_minio:
