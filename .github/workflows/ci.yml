name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nobarsync
          POSTGRES_PASSWORD: nobarsync
          POSTGRES_DB: nobarsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nobarsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.2"
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: nobarsync
          POSTGRES_PASSWORD: nobarsync
          POSTGRES_DB: nobarsync_test
      - run: mix deps.audit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  media-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/cloudflare/media-worker/package-lock.json
      - run: npm ci
      - run: npm test
