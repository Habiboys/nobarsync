# Authentication uses short-lived HMAC credentials issued by the NobarSync API.
listening-port=3478
listening-ip=0.0.0.0
fingerprint
use-auth-secret
stale-nonce=600
no-cli
no-multicast-peers
no-tcp-relay
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
user-quota=16
total-quota=256
max-bps=128000
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
no-software-attribute
